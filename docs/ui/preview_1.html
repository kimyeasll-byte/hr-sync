<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>중간 점검 화면 1</title>
<style>
  :root {
    --bg: #f5f5f7; /* 애플 특유의 밝은 회색 배경 */
    --surface: #ffffff;
    --text: #1d1d1f;
    --border: #d2d2d7;
  }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 60px 40px;
    margin: 0;
  }
  .container {
    max-width: 700px;
    margin: 0 auto;
  }
  h1 { font-size: 24px; font-weight: 600; margin-bottom: 24px; letter-spacing: -0.5px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .title { font-size: 16px; font-weight: 600; }
  .subtitle { font-size: 13px; color: #86868b; }
  .btn {
    background: #000;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>오늘의 할 일</h1>
    
    <div class="card">
      <div class="card-info">
        <span class="title">신규 입사자 '홍길동' 입사 준비</span>
        <span class="subtitle">기획팀 · 오늘 출근 예정</span>
      </div>
      <button class="btn">입사 세팅하기</button>
    </div>

    <div class="card">
      <div class="card-info">
        <span class="title">퇴사자 '김철수' 권한 회수</span>
        <span class="subtitle">영업팀 · D+1 (오늘까지 자동 회수 예정)</span>
      </div>
      <button class="btn" style="background:#f5f5f7; color:#1d1d1f; border: 1px solid var(--border);">진행 상태 보기</button>
    </div>
  </div>
</body>
</html>
